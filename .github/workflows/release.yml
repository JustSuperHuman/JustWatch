name: Release

# Push a tag like v1.2.0 to build JustWatch and publish a GitHub release.
# The app's update checker and install.ps1 both download JustWatch-win-x64.zip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/JustWatch.TrayApp/JustWatch.TrayApp.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$version -p:DebugType=none `
            -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path publish/* -DestinationPath JustWatch-win-x64.zip

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG JustWatch-win-x64.zip --clobber
          } else {
            gh release create $env:TAG JustWatch-win-x64.zip --title "JustWatch $env:TAG" --generate-notes
          }
